schema: spec-driven

context: |
  mem-words — aplicativo para ajudar a memorizar palavras.

  Este repositório é o frontend.

  Stack: React 19, Vite 8, JavaScript (JSX, sem TypeScript), oxlint.
  Estilos: CSS puro com custom properties (variáveis CSS). Sem Tailwind,
  CSS-in-JS ou biblioteca de componentes.

  Estrutura: `src/components/` para componentes, `src/api/` para chamadas
  ao backend, `src/config.js` para configuração de ambiente.

  O backend é um repositório separado (mem-words-backend), publicado no
  Render. O frontend é publicado na Vercel.

  Convenções:
  - Interface em português do Brasil (padrão) ou inglês, escolhida na tela
    de Perfil e persistida no navegador (`src/i18n/`, dicionários em
    `src/i18n/dictionaries/pt.js` e `en.js`, consumidos via
    `useTranslations()`). Comentários e documentação continuam só em
    português — a escolha de idioma afeta só o texto de interface, não o
    código.
  - Comentários e documentação em português.
  - Commits no formato conventional commits.
  - Suporte a tema claro e escuro via `prefers-color-scheme`.

